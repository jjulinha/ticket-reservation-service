# Nome da aplicacao
spring.application.name=ticket-reservation-service

# Conexao com o MySQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis - mapeia colunas snake_case para camelCase do Java
mybatis.configuration.map-underscore-to-camel-case=true

# Porta do servico
server.port=8081

# Actuator - expoe endpoints de saude e metricas (observabilidade)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# MyBatis - registra os TypeHandlers customizados (UUID <-> BINARY)
mybatis.type-handlers-package=com.unisul.seatreservation.config

# Flyway - migrations versionadas
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# MyBatis - localizacao dos arquivos XML de mapper
mybatis.mapper-locations=classpath:mapper/*.xml

# AWS Config
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
custom.aws.access-key=${AWS_ACCESS_KEY_ID}
custom.aws.secret-key=${AWS_SECRET_ACCESS_KEY}
custom.aws.session-token=${AWS_SESSION_TOKEN}